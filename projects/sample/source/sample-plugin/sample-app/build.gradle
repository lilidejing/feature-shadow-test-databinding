buildscript {
    repositories {
        if (!System.getenv().containsKey("DISABLE_TENCENT_MAVEN_MIRROR")) {
            maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
        } else {
            google()
            mavenCentral()
        }
    }

    dependencies {
        classpath 'com.tencent.shadow.core:runtime'
        classpath 'com.tencent.shadow.core:activity-container'
        classpath 'com.tencent.shadow.core:gradle-plugin'
        classpath "org.javassist:javassist:$javassist_version"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.tencent.shadow.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions' // 如果用到扩展

android {
    compileSdkVersion project.COMPILE_SDK_VERSION

    defaultConfig {
        applicationId 'com.tencent.shadow.sample.plugin.app'
        minSdkVersion project.MIN_SDK_VERSION
        targetSdkVersion project.TARGET_SDK_VERSION
        versionCode project.VERSION_CODE
        versionName project.VERSION_NAME
        multiDexEnabled true

    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.create("release")
            signingConfig.initWith(buildTypes.debug.signingConfig)
        }
    }

    // 将插件applicationId设置为和宿主相同
    productFlavors {
        plugin {
            applicationId project.SAMPLE_HOST_APP_APPLICATION_ID
        }
    }

    lintOptions {
        abortOnError false
    }

    // 将插件的资源ID分区改为和宿主0x7F不同的值
    aaptOptions {
        additionalParameters "--package-id", "0x7E", "--allow-reserved-package-id"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        dataBinding = false
    }
}

dependencies {
//    implementation project(":bury-point")
    //注意sample-host-lib要用compileOnly编译而不打包在插件中。在packagePlugin任务中配置hostWhiteList允许插件访问宿主的类。
    pluginCompileOnly project(":sample-host-lib")
    normalImplementation project(":sample-host-lib")

    pluginCompileOnly project(":sample-base-lib")
    normalImplementation project(":sample-base-lib")
//    pluginCompileOnly project(":sample-base-lib-second")
//    normalImplementation project(":sample-base-lib-second")

    //Shadow Transform后业务代码会有一部分实际引用runtime中的类
    //如果不以compileOnly方式依赖，会导致其他Transform或者Proguard找不到这些类
    pluginCompileOnly 'com.tencent.shadow.core:runtime'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
//    implementation 'com.google.android.material:material:1.4.0'
//    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation project(':custom-view')
}

preBuild.dependsOn(":sample-host-lib:jarDebugPackage")



shadow {
    transform {
//        useHostContext = ['abc']
    }

    packagePlugin {
        pluginTypes {
            debug {
                loaderApkConfig = new Tuple2('sample-loader-debug.apk', ':sample-loader:assembleDebug')
                runtimeApkConfig = new Tuple2('sample-runtime-debug.apk', ':sample-runtime:assembleDebug')
                pluginApks {
                    pluginApk1 {
                        businessName = 'sample-plugin-app'
                        partKey = 'sample-plugin-app'
                        buildTask = ':sample-app:assemblePluginDebug'
                        apkPath = 'projects/sample/source/sample-plugin/sample-app/build/outputs/apk/plugin/debug/sample-app-plugin-debug.apk'
                        hostWhiteList = ["com.tencent.shadow.sample.host.lib"]
                        dependsOn = ['sample-base'] //注意: 被依赖的插件在加载插件的时候要优先加载,且配置的是partKey
                    }

                    //插件依赖，这里也可以去掉，但是去掉后，打zip包的时候就不会把 sample-base-plugin-debug.apk 打进zip包中了
                    sampleBase {
                        businessName = 'sample-base'
                        partKey = 'sample-base'
                        buildTask = ':sample-base:assemblePluginDebug'
                        apkPath = 'projects/sample/source/sample-plugin/sample-base/build/outputs/apk/plugin/debug/sample-base-plugin-debug.apk'
                        hostWhiteList = ["com.tencent.shadow.sample.host.lib"]
                    }
                    //插件依赖，这里也可以去掉，但是去掉后，打zip包的时候就不会把 sample-base-second-plugin-debug.apk 打进zip包中了
//                    sampleBaseSecond {
//                        businessName = 'sample-base-second'
//                        partKey = 'sample-base-second'
//                        buildTask = ':sample-base-second:assemblePluginDebug'
//                        apkPath = 'projects/sample/source/sample-plugin/sample-base-second/build/outputs/apk/plugin/debug/sample-base-second-plugin-debug.apk'
//                        hostWhiteList = ["com.tencent.shadow.sample.host.lib"]
//                    }

                    //插件依赖，这里也可以去掉，但是去掉后，打zip包的时候就不会把 sample-base-plugin-debug.apk 打进zip包中了
//                    sampleChild {
//                        businessName = 'sample-child-plugin-app'
//                        partKey = 'sample-child'
//                        buildTask = ':sample-child:assemblePluginDebug'
//                        apkPath = 'projects/sample/source/sample-plugin/sample-child/build/outputs/apk/plugin/debug/sample-child-plugin-debug.apk'
//                        hostWhiteList = ["com.tencent.shadow.sample.host.lib"]
//                        dependsOn = ['sample-base'] //注意: 被依赖的插件在加载插件的时候要优先加载,且配置的是partKey
//                    }

                    //插件依赖，这里也可以去掉，但是去掉后，打zip包的时候就不会把 sample-base-plugin-debug.apk 打进zip包中了
                    /*sampleGrandSon {
                        businessName = 'sample-grandson-plugin-app'
                        partKey = 'sample-grandson'
                        buildTask = ':sample-grandson:assemblePluginDebug'
                        apkPath = 'projects/sample/source/sample-plugin/sample-grandson/build/outputs/apk/plugin/debug/sample-grandson-plugin-debug.apk'
                        hostWhiteList = ["com.tencent.shadow.sample.host.lib"]
                        dependsOn = ['sample-base']
                    }*/
                }
            }

        }

        loaderApkProjectPath = 'projects/sample/source/sample-plugin/sample-loader'
        runtimeApkProjectPath = 'projects/sample/source/sample-plugin/sample-runtime'

        archiveSuffix = System.getenv("PluginSuffix") ?: ""
        archivePrefix = 'plugin'
        destinationDir = "${getRootProject().getBuildDir()}"

        version = 4
        compactVersion = [1, 2, 3]
        uuidNickName = "1.1.5"
    }


    configurations.configureEach {
        resolutionStrategy {
            // 编译解析的时候只要有重复的版本，也就是版本冲突的时候，就会直接报错，控制台会输出具体的依赖项和版本，需要检测是否有版本冲突时打开。
//        failOnVersionConflict()
            eachDependency { DependencyResolveDetails details ->
                def requested = details.requested
                println("group-> ${requested.group}")
//            if (requested.group == 'androidx.annotation'
//                    && requested.name == 'annotation') {
//                details.useVersion "1.0.0"
//            }
               /* if (requested.group == 'org.jetbrains.kotlin') {
                    if (requested.name == 'kotlin-stdlib'
                            || requested.name == 'kotlin-stdlib-jdk7'
                            || requested.name == 'kotlin-stdlib-jdk8'
                            || requested.name == 'kotlin-stdlib-common'
                    )
                        details.useVersion "1.7.20"
                }*/

                println "发现了  ${requested.group} ${requested.name}  details-> ${requested.version}}"
                // AppCompat 强制指定版本
                if (requested.group == 'androidx.appcompat'
                        && requested.name == 'appcompat') {
                    println "发现 appcompat ${requested.group} ${requested.name}  details-> ${requested.version}}"
                    details.useVersion "1.1.0"
                    details.because("插件 A、B 必须统一 appcompat 版本，避免 1.3.1 导致 VectorDrawableCompat 报错")
                }
            }
        }

    }
}
